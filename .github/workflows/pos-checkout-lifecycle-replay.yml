name: POS Checkout Lifecycle Disposable Replay

on:
  pull_request:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/pos_checkout_lifecycle.test.sql"
      - "supabase/functions/dlice-orders/index.ts"
      - "tests/contracts/pos-checkout-lifecycle-contract.test.mjs"
      - ".github/workflows/pos-checkout-lifecycle-replay.yml"
  push:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/pos_checkout_lifecycle.test.sql"
      - "supabase/functions/dlice-orders/index.ts"
      - "tests/contracts/pos-checkout-lifecycle-contract.test.mjs"
      - ".github/workflows/pos-checkout-lifecycle-replay.yml"

permissions:
  contents: read

concurrency:
  group: pos-checkout-lifecycle-replay
  cancel-in-progress: false

jobs:
  disposable-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run POS checkout API contracts
        run: node --test tests/contracts/pos-checkout-lifecycle-contract.test.mjs
      - uses: supabase/setup-cli@v1
        id: setup-supabase-cli
        with:
          version: 2.122.0
      - name: Start isolated local Supabase stack
        id: start-local-stack
        run: supabase start -x studio,mailpit,storage-api,edge-runtime,logflare,vector
      - name: Replay every migration and run all pgTAP database contracts
        run: |
          set -euo pipefail
          supabase db reset --local
          supabase test db --local
      - name: Stop isolated local Supabase stack
        if: always() && steps.start-local-stack.outcome == 'success'
        run: supabase stop --no-backup