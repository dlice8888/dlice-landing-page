name: Staging procurement positive-path E2E
on:
  workflow_dispatch:
    inputs:
      confirm_staging_mutations:
        description: "Confirm this writes QA-prefixed records to QA-DLICE-A in staging only"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: staging-procurement-positive-e2e
  cancel-in-progress: false
jobs:
  purchase-to-stock:
    if: ${{ github.ref == 'refs/heads/staging' && github.event_name == 'workflow_dispatch' && inputs.confirm_staging_mutations == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight fixed staging target, existing identities and passwordless auth
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLIC_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_EDGE_FUNCTION_URL: ${{ secrets.STAGING_EDGE_FUNCTION_URL }}
          STAGING_TENANT_A_USER_ID: b930897c-f8fb-443b-9056-e70c08b31446
        run: |
          set +x
          missing=0
          for key in STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLIC_KEY STAGING_SUPABASE_SERVICE_ROLE_KEY STAGING_EDGE_FUNCTION_URL STAGING_TENANT_A_USER_ID; do
            if [ -z "${!key}" ]; then
              echo "::error title=STAGING PREFLIGHT BLOCKED::$key is missing; no business-flow mutations may run."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            mkdir -p artifacts
            printf '{"schema_version":1,"result":"blocked","stage":"preflight","reason":"passwordless_staging_auth_configuration_missing","environment":"staging"}\n' > artifacts/procurement-reconciliation.json
            exit 2
          fi
          if [ "$STAGING_SUPABASE_URL" != "https://higoadrzxnhzbbwhdbmh.supabase.co" ] || [ "$STAGING_EDGE_FUNCTION_URL" != "https://higoadrzxnhzbbwhdbmh.supabase.co/functions/v1/dlice-orders" ]; then
            echo "::error title=STAGING PREFLIGHT BLOCKED::Staging URL does not match the fixed staging project."
            mkdir -p artifacts
            printf '{"schema_version":1,"result":"blocked","stage":"preflight","reason":"staging_target_mismatch","environment":"staging"}\n' > artifacts/procurement-reconciliation.json
            exit 2
          fi
          if ! node --input-type=module <<'NODE'
          import { isServiceRoleKey } from "./tests/runtime/supabase-api-key.mjs";
          if (!isServiceRoleKey(process.env.STAGING_SUPABASE_SERVICE_ROLE_KEY)) process.exit(1);
          NODE
          then
            mkdir -p artifacts
            printf '{"schema_version":1,"result":"blocked","stage":"preflight","reason":"service_role_key_format_invalid","environment":"staging"}\\n' > artifacts/procurement-reconciliation.json
            echo "::error title=STAGING PREFLIGHT BLOCKED::Service-role key format is invalid; no business-flow mutations ran."
            exit 2
          fi
      - name: Run positive P2P E2E against the fixed staging project and existing QA identity
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLIC_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_EDGE_FUNCTION_URL: ${{ secrets.STAGING_EDGE_FUNCTION_URL }}
          STAGING_TENANT_A_USER_ID: b930897c-f8fb-443b-9056-e70c08b31446
        run: node tests/staging/procurement-receiving-positive.mjs
      - name: Validate reconciliation artifact even when the E2E fails
        if: always()
        run: |
          mkdir -p artifacts
          file=artifacts/procurement-reconciliation.json
          if [ ! -s "$file" ] || ! node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!x || typeof x !== "object" || typeof x.result !== "string") process.exit(1)' "$file" 2>/dev/null; then
            printf '{"schema_version":1,"result":"failed","stage":"artifact_validation","reason":"missing_or_invalid_reconciliation_artifact","environment":"staging"}\n' > "$file"
            echo "::error title=Reconciliation artifact invalid::A missing or invalid procurement artifact was replaced with explicit failed evidence."
            exit 1
          fi
      - name: Upload sanitized procurement reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: procurement-reconciliation-${{ github.run_id }}
          path: artifacts/procurement-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
