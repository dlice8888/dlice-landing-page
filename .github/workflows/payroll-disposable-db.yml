name: Free payroll disposable database replay
on:
  pull_request:
    paths:
      - "supabase/**"
      - "docs/implementation/sql/HR_WORKFORCE_SCHEMA_DRAFT.sql"
      - "docs/implementation/sql/HR_PAYROLL_FINANCE_SCHEMA_DRAFT.sql"
      - "docs/implementation/sql/HR_PAYROLL_PAYMENT_ADAPTERS_DRAFT.sql"
      - "docs/implementation/sql/HR_PAYROLL_PAYMENT_FINANCE_CLEARING_DRAFT.sql"
      - ".github/workflows/payroll-disposable-db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payroll-disposable-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Start disposable local Supabase stack
        run: supabase start
      - name: Replay canonical repository migrations
        run: supabase db reset
      - name: Replay HR and payroll dependencies in dependency order
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f docs/implementation/sql/HR_WORKFORCE_SCHEMA_DRAFT.sql
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f docs/implementation/sql/HR_PAYROLL_FINANCE_SCHEMA_DRAFT.sql
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f docs/implementation/sql/HR_PAYROLL_PAYMENT_ADAPTERS_DRAFT.sql
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f docs/implementation/sql/HR_PAYROLL_PAYMENT_FINANCE_CLEARING_DRAFT.sql
      - name: Run pgTAP database security contracts
        run: supabase test db
      - name: Stop and discard disposable database
        if: always()
        run: supabase stop --no-backup
