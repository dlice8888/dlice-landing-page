name: Disposable local Supabase migration replay
on:
  pull_request:
    branches: [staging, audit/combined-migration-replay-20261121]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/functions/dlice-orders/**"
      - ".github/workflows/disposable-migration-replay.yml"
      - ".github/workflows/staging-tenant-isolation-acceptance.yml"
      - ".github/workflows/quality-checks.yml"
      - "tests/runtime/**"
      - "tests/contracts/**"
  push:
    branches: [staging, audit/combined-migration-replay-20261121]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/disposable-migration-replay.yml"
      - ".github/workflows/staging-tenant-isolation-acceptance.yml"
      - ".github/workflows/quality-checks.yml"
      - "tests/runtime/**"
      - "tests/contracts/**"

permissions:
  contents: read

concurrency:
  group: disposable-migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Replay all repository migrations against a disposable local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cleanup() {
            (cd "$tmp" && supabase stop --no-backup) >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          cd "$tmp"
          supabase init
          # Allocate a unique project ID and port range for every disposable replay.
          # runner starts its temporary Inbucket service alongside the local stack.
          base_port="$(python3 - <<'PY'
          import os, socket
          seed = 30000 + (int(os.environ["GITHUB_RUN_ID"]) % 20000)
          for offset in range(0, 20000, 5):
              base = 30000 + ((seed - 30000 + offset) % 20000)
              sockets = []
              try:
                  for port in range(base, base + 5):
                      sock = socket.socket()
                      sock.bind(("0.0.0.0", port))
                      sockets.append(sock)
                  print(base)
                  break
              except OSError:
                  pass
              finally:
                  for sock in sockets:
                      sock.close()
          else:
              raise SystemExit("No available port block for disposable Supabase")
          PY
          )"
          sed -i \
            -e "s/^project_id = .*/project_id = \"dlice-migration-${GITHUB_RUN_ID}\"/" \
            -e "s/^port = 54321$/port = $((base_port + 1))/" \
            -e "s/^port = 54322$/port = $((base_port + 2))/" \
            -e "s/^shadow_port = 54320$/shadow_port = ${base_port}/" \
            -e "s/^port = 54323$/port = $((base_port + 3))/" \
            -e "s/^port = 54324$/port = $((base_port + 4))/" \
            supabase/config.toml
          mkdir -p supabase/migrations supabase/tests supabase/functions
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE"/supabase/tests/*.sql supabase/tests/
          cp -R "$GITHUB_WORKSPACE"/supabase/functions/dlice-orders supabase/functions/
          echo "Replay commit: $GITHUB_SHA"
          echo "Migration files in disposable replay: $(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          supabase start
          supabase db reset
          echo "PASS: all repository migrations applied to the disposable local database."
          supabase test db
          echo "PASS: migration and database contract tests passed."
          echo "Preparing free local Edge Function runtime fault injection."
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          set +x
          eval "$(supabase status -o env)"
          export LOCAL_SUPABASE_URL="http://127.0.0.1:$((base_port + 1))"
          export LOCAL_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?local service role key unavailable}"
          export LOCAL_ANON_KEY="${ANON_KEY:?local anon key unavailable}"
          export LOCAL_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:$((base_port + 2))/postgres"
          export SUPABASE_WORKDIR="$tmp"
          psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/tests/runtime/online-payment-fault-fixtures.sql"
          node "$GITHUB_WORKSPACE/tests/runtime/online-payment-fault-injection.mjs"
          echo "PASS: disposable HTTP/API runtime fault injection completed."
