name: Verify Superpowers submodule

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "tools/superpowers"
      - "AGENTS.md"
      - "docs/engineering/superpowers-integration.md"
      - "supabase/functions/dlice-orders/index.ts"
      - "tests/contracts/production-cors-contract.test.mjs"
      - ".github/workflows/production-cors-contract.yml"
      - ".github/workflows/verify-superpowers.yml"
  push:
    branches:
      - main
      - chore/integrate-superpowers
    paths:
      - ".gitmodules"
      - "tools/superpowers"
      - "AGENTS.md"
      - "docs/engineering/superpowers-integration.md"
      - ".github/workflows/verify-superpowers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-submodule:
    name: Verify pinned upstream checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and initialize submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node for repository contracts
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify production CORS contract
        run: node --test tests/contracts/production-cors-contract.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check production Edge Function
        run: deno check supabase/functions/dlice-orders/index.ts

      - name: Verify pinned Superpowers commit
        shell: bash
        run: |
          set -euo pipefail
          expected="2ce8aa15d05bd57213e6f746f953aafb7ded7a8b"
          actual="$(git -C tools/superpowers rev-parse HEAD)"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"

      - name: Verify upstream source files are present
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/superpowers/LICENSE
          test -f tools/superpowers/README.md
          test -f tools/superpowers/skills/using-superpowers/SKILL.md
          git submodule status --recursive
