name: Free quality checks
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check runtime
        run: node --version
      - name: Run dependency-free quality checks
        run: node scripts/quality-checks.mjs
      - name: Run staging release contract tests
        run: node scripts/staging-release-contract-tests.mjs
      - name: Run tenant refund authorization contract tests
        run: node --test tests/contracts/tenant-refund-scope-contract.test.mjs
      - name: Require migration and documentation review
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          test "${#migrations[@]}" -gt 0
          for file in "${migrations[@]}"; do
            test -s "$file"
          done
          test -s docs/FREE_OPTIMIZATION_ROLLOUT.md
          test -s docs/STAGING_RELEASE_CHECKLIST.md
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
            if grep -q '^supabase/migrations/.*\.sql$' <<<"$changed"; then
              grep -Eq '^docs/.*\.md$' <<<"$changed" || {
                echo "::error::A PR changing migrations must also update docs/release or rollout notes."
                exit 1
              }
            fi
          fi
          echo "Migration files and release notes exist; migration-changing PRs must update docs."
