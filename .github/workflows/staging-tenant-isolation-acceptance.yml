name: Staging Tenant Isolation Acceptance

# Run only from the trusted staging branch; never expose staging credentials to PR code.
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - "tests/runtime/dlice-tenant-jwt-isolation.mjs"
      - ".github/workflows/staging-tenant-isolation-acceptance.yml"
      - "supabase/functions/dlice-orders/index.ts"
      - "supabase/functions/dlice-orders/tenant-permissions.ts"
      - "supabase/functions/staging-tenant-session/**"
      - "supabase/migrations/20261120140000_staging_machine_session_issuance_audit.sql"

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-tenant-isolation-acceptance
  cancel-in-progress: false

jobs:
  tenant-isolation:
    # Manual dispatch is accepted only when the selected ref is the trusted staging branch.
    if: github.ref == 'refs/heads/staging'
    name: Authenticated tenant isolation P01-P09
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
      # Tenant/branch/user UUIDs are derived from the authenticated A/B identities at runtime.
      STAGING_TENANT_A_BRANCH_CODE: QA-DLICE-A
      STAGING_TENANT_B_BRANCH_CODE: QA-TENANT-B
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exchange GitHub OIDC identity for two short-lived staging user sessions
        shell: bash
        run: |
          set -euo pipefail
          set +x
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dlice-staging-tenant-isolation")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -er '.value')"
          unset oidc_json
          for slot in A B; do
            response="$(curl --fail --silent --show-error -X POST "${STAGING_SUPABASE_URL}/functions/v1/staging-tenant-session" -H "Authorization: Bearer ${oidc_token}" -H "Content-Type: application/json" --data "{\"tenant\":\"$slot\"}")"
            access_token="$(printf '%s' "$response" | jq -er '.session.access_token')"
            user_id="$(printf '%s' "$response" | jq -er '.identity.user_id')"
            if [ "${#access_token}" -lt 100 ] || [ "${#user_id}" -ne 36 ]; then echo "::error::OIDC broker returned an invalid session envelope."; exit 1; fi
            echo "::add-mask::$access_token"
            echo "STAGING_TENANT_${slot}_ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"
            unset response access_token user_id
          done
          unset oidc_token
      - name: Preflight and execute all tenant-isolation probes
        id: probes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tests/runtime/dlice-tenant-jwt-isolation.mjs > staging-tenant-isolation-evidence.jsonl 2>&1
          result=$?
          set -e
          cat staging-tenant-isolation-evidence.jsonl
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Summarize P01-P09 and configuration preflight
        if: always()
        env:
          PROBE_EXIT_CODE: ${{ steps.probes.outputs.exit_code }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const output = process.env.GITHUB_STEP_SUMMARY;
          const records = readFileSync("staging-tenant-isolation-evidence.jsonl", "utf8")
            .split(/\r?\n/)
            .flatMap((line) => {
              try { return [JSON.parse(line)]; } catch { return []; }
            });
          const probes = records.filter((record) => /^P\d\d$/.test(record.probeId));
          const summary = records.find((record) => record.probeId === "SUMMARY");
          const preflight = records.filter((record) => record.probeId === "PREFLIGHT");
          const status = summary?.status ?? "BLOCKED";
          const rows = probes.map((probe) =>
            `| ${probe.probeId} | ${probe.status} | ${probe.timestamp ?? "not recorded"} | ${String(probe.actualResult ?? "No probe result").replaceAll("|", "\\|")} |`
          );
          appendFileSync(output, [
            "## Staging tenant-isolation acceptance",
            "",
            `- Result: **${status}**`,
            `- Commit: \`${process.env.GITHUB_SHA}\``,
            `- Workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
            `- Configuration inputs individually checked: ${preflight.length}; values were not logged`,
            `- Counts: PASS ${summary?.pass ?? 0}, FAILED ${summary?.fail ?? 0}, BLOCKED ${summary?.blocked ?? 9}, SKIPPED ${summary?.skipped ?? 0}`,
            "",
            "| Probe | Status | Timestamp (UTC) | Result |",
            "|---|---|---|---|",
            ...rows,
            "",
            "Full structured evidence is in this job's retained log under the probe step.",
            "",
          ].join("\n"));
          NODE
      - name: Enforce complete P01-P09 acceptance
        if: always()
        env:
          PROBE_EXIT_CODE: ${{ steps.probes.outputs.exit_code }}
        run: |
          if [ "${PROBE_EXIT_CODE:-}" != "0" ]; then
            echo "::error::Staging tenant-isolation acceptance did not pass; see the structured evidence above."
            exit 1
          fi
