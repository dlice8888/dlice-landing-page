name: Free quality checks
on:
  push:
    branches:
      - feat/free-hardening-optimizations
      - feat/staging-order-receipt-gates
      - main
  pull_request:
    branches:
      - feat/staging-order-receipt-gates
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runtime
        run: node --version
      - name: Run dependency-free quality checks
        run: node scripts/quality-checks.mjs
