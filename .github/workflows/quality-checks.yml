name: Free quality checks
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runtime
        run: node --version
      - name: Run dependency-free quality checks
        run: node scripts/quality-checks.mjs
      - name: Require migration review notes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          test "${#migrations[@]}" -gt 0
          for file in "${migrations[@]}"; do
            test -s "$file"
            if grep -Eiq 'drop[[:space:]]+(table|schema|column)|truncate[[:space:]]' "$file"; then
              echo "::error file=$file::Potentially destructive DDL requires explicit reviewer confirmation and rollback plan."
              exit 1
            fi
          done
          test -s docs/FREE_OPTIMIZATION_ROLLOUT.md
          echo "Migration files exist and rollout/review notes are present."
