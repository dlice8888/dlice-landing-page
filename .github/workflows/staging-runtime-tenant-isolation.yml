name: Staging Runtime Tenant Isolation

# Trusted staging-only runtime gate. Never expose staging credentials to pull_request code.
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - "tests/runtime/dlice-tenant-jwt-isolation.mjs"
      - ".github/workflows/staging-runtime-tenant-isolation.yml"

permissions:
  contents: read

concurrency:
  group: staging-runtime-tenant-isolation
  cancel-in-progress: false

jobs:
  tenant-isolation:
    name: Authenticated tenant boundary probes
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
      # Canonical credentials only. No legacy alias can silently substitute a different identity.
      STAGING_TENANT_A_USERNAME: ${{ secrets.STAGING_TENANT_A_USERNAME }}
      STAGING_TENANT_A_PASSWORD: ${{ secrets.STAGING_TENANT_A_PASSWORD }}
      STAGING_TENANT_B_USERNAME: ${{ secrets.STAGING_TENANT_B_USERNAME }}
      STAGING_TENANT_B_PASSWORD: ${{ secrets.STAGING_TENANT_B_PASSWORD }}
      # Fixture identifiers are GitHub Environment variables and are validated against staging records.
      STAGING_TENANT_A_BRANCH_ID: ${{ vars.STAGING_TENANT_A_BRANCH_ID }}
      STAGING_TENANT_B_BRANCH_ID: ${{ vars.STAGING_TENANT_B_BRANCH_ID }}
      STAGING_TENANT_A_USER_ID: ${{ vars.STAGING_TENANT_A_USER_ID }}
      STAGING_TENANT_B_USER_ID: ${{ vars.STAGING_TENANT_B_USER_ID }}
      # Emit source labels only; never print credential values.
      STAGING_TENANT_A_USERNAME_SOURCE: ${{ secrets.STAGING_TENANT_A_USERNAME != '' && 'canonical' || 'missing' }}
      STAGING_TENANT_A_PASSWORD_SOURCE: ${{ secrets.STAGING_TENANT_A_PASSWORD != '' && 'canonical' || 'missing' }}
      STAGING_TENANT_B_USERNAME_SOURCE: ${{ secrets.STAGING_TENANT_B_USERNAME != '' && 'canonical' || 'missing' }}
      STAGING_TENANT_B_PASSWORD_SOURCE: ${{ secrets.STAGING_TENANT_B_PASSWORD != '' && 'canonical' || 'missing' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A failed preflight emits explicit BLOCKED evidence for every dependent probe and fails the gate.
      - name: Preflight and execute tenant-isolation probes
        run: node tests/runtime/dlice-tenant-jwt-isolation.mjs
