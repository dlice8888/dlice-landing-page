name: Staging Runtime Tenant Isolation

# Trusted staging-only runtime gate. Do not run untrusted pull-request code with
# staging credentials. PR validation is handled by ordinary secret-free checks.
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - "tests/runtime/dlice-tenant-jwt-isolation.mjs"
      - ".github/workflows/staging-runtime-tenant-isolation.yml"

permissions:
  contents: read

concurrency:
  group: staging-runtime-tenant-isolation
  cancel-in-progress: false

jobs:
  tenant-isolation:
    name: Authenticated tenant boundary probes
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
      STAGING_TENANT_A_USERNAME: ${{ secrets.STAGING_TENANT_A_USERNAME || secrets.STAGING_TEST_OWNER_USERNAME }}
      STAGING_TENANT_A_PASSWORD: ${{ secrets.STAGING_TENANT_A_PASSWORD || secrets.STAGING_TEST_OWNER_PASSWORD }}
      STAGING_TENANT_B_USERNAME: ${{ secrets.STAGING_TENANT_B_USERNAME }}
      STAGING_TENANT_B_PASSWORD: ${{ secrets.STAGING_TENANT_B_PASSWORD }}
      # Fixture identifiers are GitHub Environment variables, not source literals.
      # Values are checked against live staging Auth/tenant/branch records before use.
      STAGING_TENANT_A_BRANCH_ID: ${{ vars.STAGING_TENANT_A_BRANCH_ID }}
      STAGING_TENANT_B_BRANCH_ID: ${{ vars.STAGING_TENANT_B_BRANCH_ID }}
      STAGING_TENANT_A_USER_ID: ${{ vars.STAGING_TENANT_A_USER_ID }}
      STAGING_TENANT_B_USER_ID: ${{ vars.STAGING_TENANT_B_USER_ID }}
      # Emit only the selected secret alias name; never expose credential values.
      STAGING_TENANT_A_USERNAME_SOURCE: ${{ secrets.STAGING_TENANT_A_USERNAME != '' && 'canonical' || (secrets.STAGING_TEST_OWNER_USERNAME != '' && 'legacy-owner-alias' || 'missing') }}
      STAGING_TENANT_A_PASSWORD_SOURCE: ${{ secrets.STAGING_TENANT_A_PASSWORD != '' && 'canonical' || (secrets.STAGING_TEST_OWNER_PASSWORD != '' && 'legacy-owner-alias' || 'missing') }}
      STAGING_TENANT_B_USERNAME_SOURCE: ${{ secrets.STAGING_TENANT_B_USERNAME != '' && 'canonical' || 'missing' }}
      STAGING_TENANT_B_PASSWORD_SOURCE: ${{ secrets.STAGING_TENANT_B_PASSWORD != '' && 'canonical' || 'missing' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Preflight and all security probes live in one process/step. A failed
      # preflight emits explicit BLOCKED results for every required probe and
      # exits non-zero; GitHub cannot mark a separate test step as skipped.
      - name: Preflight and execute all tenant-isolation probes
        run: node tests/runtime/dlice-tenant-jwt-isolation.mjs
