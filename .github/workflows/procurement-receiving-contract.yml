name: Procurement receiving contract
on:
  pull_request:
    branches: [staging]
    paths:
      - supabase/functions/dlice-orders/index.ts
      - erp.html
      - tests/contracts/procurement-receiving-contract.mjs
      - .github/workflows/procurement-receiving-contract.yml
  push:
    branches: [staging]
    paths:
      - supabase/functions/dlice-orders/index.ts
      - erp.html
      - tests/contracts/procurement-receiving-contract.mjs
      - .github/workflows/procurement-receiving-contract.yml
permissions:
  contents: read
concurrency:
  group: procurement-receiving-contract
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify PO line IDs reach receiving payload
        run: node tests/contracts/procurement-receiving-contract.mjs
