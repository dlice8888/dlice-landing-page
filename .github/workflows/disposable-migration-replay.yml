name: Disposable local Supabase migration replay
on:
  pull_request:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/disposable-migration-replay.yml"
  push:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/disposable-migration-replay.yml"

permissions:
  contents: read

jobs:
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Replay all repository migrations against a disposable local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cleanup() {
            (cd "$tmp" && supabase stop --no-backup) >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          cd "$tmp"
          supabase init
          mkdir -p supabase/migrations supabase/tests
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE"/supabase/tests/*.sql supabase/tests/
          echo "Replay commit: $GITHUB_SHA"
          echo "Migration files in disposable replay: $(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          start_log="$tmp/supabase-start.log"
          if ! supabase start >"$start_log" 2>&1; then
            echo "::error::Disposable Supabase failed to start."
            grep -viE '(key|secret|password|jwt|token|authorization|bearer)' "$start_log" | tail -80 || true
            exit 1
          fi
          rm -f "$start_log"
          supabase db reset
          echo "PASS: all repository migrations applied to the disposable local database."
          supabase test db
