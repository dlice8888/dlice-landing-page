name: Staging KDS POS Stock and Offline Recovery E2E
on:
  workflow_dispatch:
    inputs:
      confirm_staging_mutations:
        description: "Confirm this activates the QA-only product temporarily and writes QA-prefixed POS/KDS/stock records to staging"
        required: true
        type: boolean
        default: false
  schedule:
    # Daily 09:17 WIB. Scheduled runs are restricted to the repository default branch (staging).
    - cron: "17 2 * * *"
permissions:
  contents: read
concurrency:
  group: staging-kds-pos-stock-positive-e2e
  cancel-in-progress: false
jobs:
  kds-pos-stock:
    if: ${{ (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/feat/staging-kds-offline-tenant-20261024') && (github.event_name == 'schedule' || inputs.confirm_staging_mutations == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight staging configuration before any business-flow mutation
        env:
          STAGING_SUPABASE_URL: https://higoadrzxnhzbbwhdbmh.supabase.co
          STAGING_SUPABASE_PUBLIC_KEY: sb_publishable_IdIMH7cyqSpQzlOttr2HNw_EA0kJOVo
          STAGING_EDGE_FUNCTION_URL: https://higoadrzxnhzbbwhdbmh.supabase.co/functions/v1/dlice-orders
          STAGING_TEST_OWNER_USERNAME: ${{ secrets.STAGING_TEST_OWNER_USERNAME }}
          STAGING_TEST_OWNER_PASSWORD: ${{ secrets.STAGING_TEST_OWNER_PASSWORD }}
          STAGING_TEST_BRANCH_A_USERNAME: ${{ secrets.STAGING_TEST_BRANCH_A_USERNAME }}
          STAGING_TEST_BRANCH_A_PASSWORD: ${{ secrets.STAGING_TEST_BRANCH_A_PASSWORD }}
        run: |
          set +x
          missing=0
          for key in STAGING_TEST_OWNER_USERNAME STAGING_TEST_OWNER_PASSWORD STAGING_TEST_BRANCH_A_USERNAME STAGING_TEST_BRANCH_A_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error title=STAGING PREFLIGHT BLOCKED::$key is missing; no business-flow mutations may run."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            mkdir -p artifacts
            printf '{"schema_version":1,"status":"BLOCKED","stage":"preflight","reason":"temporary_qa_auth_not_provisioned","workflow":"kds-pos-stock"}\n' > artifacts/kds-pos-stock-reconciliation.json
            exit 2
          fi
          if [ "$STAGING_SUPABASE_URL" != "https://higoadrzxnhzbbwhdbmh.supabase.co" ] || [ "$STAGING_EDGE_FUNCTION_URL" != "https://higoadrzxnhzbbwhdbmh.supabase.co/functions/v1/dlice-orders" ]; then
            echo "::error title=STAGING PREFLIGHT BLOCKED::Staging URL does not match the fixed staging project."
            mkdir -p artifacts
            printf '{"schema_version":1,"status":"BLOCKED","stage":"preflight","reason":"staging_target_mismatch","workflow":"kds-pos-stock"}\n' > artifacts/kds-pos-stock-reconciliation.json
            exit 2
          fi
      - name: Run POS → payment → KDS → recipe stock → report and offline replay E2E
        env:
          STAGING_SUPABASE_URL: https://higoadrzxnhzbbwhdbmh.supabase.co
          STAGING_SUPABASE_PUBLIC_KEY: sb_publishable_IdIMH7cyqSpQzlOttr2HNw_EA0kJOVo
          STAGING_EDGE_FUNCTION_URL: https://higoadrzxnhzbbwhdbmh.supabase.co/functions/v1/dlice-orders
          STAGING_TEST_OWNER_USERNAME: ${{ secrets.STAGING_TEST_OWNER_USERNAME }}
          STAGING_TEST_OWNER_PASSWORD: ${{ secrets.STAGING_TEST_OWNER_PASSWORD }}
          STAGING_TEST_BRANCH_A_USERNAME: ${{ secrets.STAGING_TEST_BRANCH_A_USERNAME }}
          STAGING_TEST_BRANCH_A_PASSWORD: ${{ secrets.STAGING_TEST_BRANCH_A_PASSWORD }}
        run: node tests/staging/kds-pos-stock-positive.mjs
      - name: Validate reconciliation artifact even when the E2E fails
        if: always()
        run: |
          mkdir -p artifacts
          file=artifacts/kds-pos-stock-reconciliation.json
          if [ ! -s "$file" ] || ! node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!x || typeof x !== "object" || typeof x.status !== "string") process.exit(1)' "$file" 2>/dev/null; then
            printf '{"schema_version":1,"status":"FAIL","stage":"artifact_validation","reason":"missing_or_invalid_reconciliation_artifact","workflow":"kds-pos-stock"}\n' > "$file"
            echo "::error title=Reconciliation artifact invalid::A missing or invalid KDS/POS/stock artifact was replaced with explicit FAIL evidence."
            exit 1
          fi
      - name: Upload sanitized KDS/POS/stock reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kds-pos-stock-reconciliation-${{ github.run_id }}
          path: artifacts/kds-pos-stock-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
