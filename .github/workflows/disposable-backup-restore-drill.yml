name: Free disposable backup restore drill
on:
  push:
    branches:
      - "qa/backup-restore-drill-20261125"
  pull_request:
    paths:
      - "scripts/qa/backup-restore-drill.sh"
      - ".github/workflows/disposable-backup-restore-drill.yml"
      - "docs/implementation/BACKUP_RESTORE_DRILL.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run PostgreSQL 17 dump/restore rehearsal
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD \
            postgres:17.11 bash scripts/qa/backup-restore-drill.sh
