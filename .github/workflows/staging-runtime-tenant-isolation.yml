name: Staging Runtime Tenant Isolation

on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - "tests/runtime/dlice-tenant-jwt-isolation.mjs"
      - ".github/workflows/staging-runtime-tenant-isolation.yml"
  push:
    branches: [staging]
    paths:
      - "tests/runtime/dlice-tenant-jwt-isolation.mjs"
      - ".github/workflows/staging-runtime-tenant-isolation.yml"

permissions:
  contents: read

concurrency:
  group: staging-runtime-tenant-isolation
  cancel-in-progress: false

jobs:
  pull-request-static-check:
    name: Pull request static check (no staging secrets)
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static syntax validation
        run: node --check tests/runtime/dlice-tenant-jwt-isolation.mjs

  tenant-isolation:
    name: Authenticated tenant boundary probes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
      STAGING_TENANT_A_USERNAME: ${{ (secrets.STAGING_TENANT_A_USERNAME || secrets.STAGING_TEST_OWNER_USERNAME) }}
      STAGING_TENANT_A_PASSWORD: ${{ (secrets.STAGING_TENANT_A_PASSWORD || secrets.STAGING_TEST_OWNER_PASSWORD) }}
      STAGING_TENANT_B_USERNAME: ${{ (secrets.STAGING_TENANT_B_USERNAME || secrets.STAGING_TEST_BRANCH_A_USERNAME) }}
      STAGING_TENANT_B_PASSWORD: ${{ (secrets.STAGING_TENANT_B_PASSWORD || secrets.STAGING_TEST_BRANCH_A_PASSWORD) }}
      STAGING_TENANT_A_JWT: ${{ secrets.STAGING_TENANT_A_JWT }}
      STAGING_TENANT_B_JWT: ${{ secrets.STAGING_TENANT_B_JWT }}
      STAGING_TENANT_A_ID: 00000000-0000-4000-8000-000000000001
      STAGING_TENANT_B_ID: 00000000-0000-4000-8000-000000000002
      STAGING_TENANT_A_BRANCH_ID: 90000000-0000-4000-8000-000000000001
      STAGING_TENANT_B_BRANCH_ID: 90000000-0000-4000-8000-000000000004
      STAGING_TENANT_A_USER_ID: 378f02bc-2719-4b07-9107-4ce94299aa27
      STAGING_TENANT_B_USER_ID: e1de1ffc-9fae-412f-9dd7-0993b54cb631
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate staging inputs without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in STAGING_SUPABASE_URL STAGING_SUPABASE_ANON_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required staging secret: $name"
              exit 2
            fi
          done
          for tenant in A B; do
            username="STAGING_TENANT_${tenant}_USERNAME"
            password="STAGING_TENANT_${tenant}_PASSWORD"
            if [[ -z "${!username:-}" || -z "${!password:-}" ]]; then
              echo "::error::Tenant ${tenant} requires its own username and password; JWT-only fallback is not accepted for this login proof."
              exit 2
            fi
            echo "Tenant ${tenant}: independent username/password pair configured."
          done
          echo "Both independent login pairs and required staging inputs are present; secret values are not displayed."
      - name: Authenticate both QA identities and run read-only tenant isolation probes
        run: node tests/runtime/dlice-tenant-jwt-isolation.mjs
