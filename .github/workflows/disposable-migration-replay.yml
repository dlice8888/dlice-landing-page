name: Disposable local Supabase migration replay
on:
  # Manual dispatch is safe: this workflow uses only an isolated local Supabase stack.
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/disposable-migration-replay.yml"
  # Replay candidate migrations on every branch push; this uses only a disposable local database.
  push:
    branches: ["**"]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/disposable-migration-replay.yml"

permissions:
  contents: read

concurrency:
  group: disposable-migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Replay all repository migrations against a disposable local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cleanup() {
            (cd "$tmp" && supabase stop --no-backup) >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          cd "$tmp"
          supabase init
          # Allocate a unique project ID and port range for every disposable replay.
          base_port="$(python3 - <<'PY'
          import os, socket
          # Keep the disposable port block below Linux's typical ephemeral range
          # (32768-60999) to avoid collisions with runner outbound ephemeral sockets.
          seed = 20000 + (int(os.environ["GITHUB_RUN_ID"]) % 2000) * 5
          for offset in range(0, 10000, 5):
              base = 20000 + ((seed - 20000 + offset) % 10000)
              sockets = []
              try:
                  for port in range(base, base + 5):
                      sock = socket.socket()
                      sock.bind(("0.0.0.0", port))
                      sockets.append(sock)
                  print(base)
                  break
              except OSError:
                  pass
              finally:
                  for sock in sockets:
                      sock.close()
          else:
              raise SystemExit("No available port block for disposable Supabase")
          PY
          )"
          sed -i \
            -e "s/^project_id = .*/project_id = \"dlice-migration-${GITHUB_RUN_ID}\"/" \
            -e "s/^port = 54321$/port = $((base_port + 1))/" \
            -e "s/^port = 54322$/port = $((base_port + 2))/" \
            -e "s/^shadow_port = 54320$/shadow_port = ${base_port}/" \
            -e "s/^port = 54323$/port = $((base_port + 3))/" \
            -e "s/^port = 54324$/port = $((base_port + 4))/" \
            supabase/config.toml
          mkdir -p supabase/migrations supabase/tests
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE"/supabase/tests/*.sql supabase/tests/
          echo "Replay commit: $GITHUB_SHA"
          echo "Migration files in disposable replay: $(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          supabase start
          supabase db reset
          echo "PASS: all repository migrations applied to the disposable local database."
          supabase test db
          echo "PASS: migration and database contract tests passed."
