name: Free quality checks
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check runtime
        run: node --version
      - name: Run dependency-free quality checks
        run: node scripts/quality-checks.mjs
      - name: Verify feature matrix consistency
        run: node --test tests/contracts/feature-matrix-contract.test.mjs
      - name: Run staging release contract tests
        run: node scripts/staging-release-contract-tests.mjs
      - name: Run KDS POS stock and offline recovery contract
        run: node --test tests/contracts/kitchen-kds-offline-contract.test.mjs
      - name: Run POS checkout lifecycle contract
        run: node --test tests/contracts/pos-checkout-lifecycle-contract.test.mjs
      - name: Verify atomic tenant bootstrap contract
        run: node --test tests/contracts/tenant-bootstrap-atomic-contract.test.mjs
      - name: Verify Owner metadata JSON boolean and current JWT role claim contract
        run: node --test tests/contracts/owner-metadata-boolean-contract.test.mjs
      - name: Verify atomic tenant invite lifecycle contract
        run: node --test tests/contracts/tenant-invite-atomic-contract.test.mjs
      - name: Run tenant refund authorization contract tests
        run: node --test tests/contracts/tenant-refund-scope-contract.test.mjs
      - name: Run service-role tenant-scope contract tests
        run: node --test tests/contracts/tenant-service-role-scope-contract.test.mjs
      - name: Set up Deno for Edge Function authorization tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.8
      - name: Type-check dlice-orders Edge Function
        run: deno check supabase/functions/dlice-orders/index.ts
      - name: Run tenant permission unit tests
        run: deno test supabase/functions/dlice-orders/tenant-permissions_test.ts
      - name: Run breached-password guard unit tests
        run: deno test supabase/functions/dlice-orders/password-security_test.ts
      - name: Verify leaked-password guard on Auth flows
        run: node --test tests/contracts/leaked-password-guard-contract.test.mjs
      - name: Run ERP command-center contract tests
        run: node --test tests/contracts/command-center-contract.test.mjs
      - name: Run branch checklist atomic audit contract tests
        run: node --test tests/contracts/branch-checklist-audit-contract.test.mjs
      - name: Run atomic admin permission audit contract tests
        run: node --test tests/contracts/admin-permission-audit-contract.test.mjs
      - name: Verify staging secret workflow triggers
        run: node --test tests/contracts/staging-secret-workflow-contract.test.mjs
      - name: Verify passwordless positive-path staging E2E auth
        run: node --test tests/contracts/staging-passwordless-e2e-contract.test.mjs
      - name: Verify tenant worker profile role boundary
        run: node --test tests/contracts/tenant-worker-profile-role-contract.test.mjs
      - name: Verify stock workflow RPC execute ACL boundary
        run: node --test tests/contracts/stock-workflow-rpc-acl-contract.test.mjs
      - name: Verify default public RPC execute ACL boundary
        run: node --test tests/contracts/default-function-acl-contract.test.mjs
      - name: Run free commerce runtime fault-injection simulations
        run: node --test tests/runtime/commerce-fault-injection.test.mjs
      - name: Verify Supabase API key compatibility helper
        run: node --check tests/runtime/supabase-api-key.mjs
      - name: Verify runtime tenant-isolation probe evidence
        run: |
          node --check tests/runtime/dlice-tenant-jwt-isolation.mjs
          node --test tests/contracts/tenant-runtime-probe-contract.test.mjs
      - name: Test authenticated tenant fixture discovery
        run: node --test tests/contracts/tenant-fixture-discovery.test.mjs
      - name: Verify public tenant routing release gate
        run: node --test tests/contracts/public-tenant-routing-gate-contract.test.mjs
      - name: Verify recovered migration source
        run: node --test tests/contracts/migration-source-recovery-contract.test.mjs
      - name: Validate migration and documentation coverage
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          test "${#migrations[@]}" -gt 0
          for file in "${migrations[@]}"; do
            test -s "$file"
          done
          test -s docs/FREE_OPTIMIZATION_ROLLOUT.md
          test -s docs/STAGING_RELEASE_CHECKLIST.md
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
            if grep -q '^supabase/migrations/.*\.sql$' <<<"$changed"; then
              grep -Eq '^docs/.*\.md$' <<<"$changed" || {
                echo "::error::A PR changing migrations must also update docs/release or rollout notes."
                exit 1
              }
            fi
          fi
          echo "Migration files and release notes exist; migration changes must update release documentation."
  staging-pos-e2e:
    if: ${{ github.ref == 'refs/heads/feat/pos-checkout-lifecycle-20261124' || github.head_ref == 'feat/pos-checkout-lifecycle-20261124' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - name: Checkout exact authorized staging E2E commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight fixed staging target and passwordless auth configuration
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLIC_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +x
          missing=0
          for key in STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLIC_KEY STAGING_SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error title=STAGING PREFLIGHT BLOCKED::$key is missing; no business-flow mutations may run."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            mkdir -p artifacts
            printf '{"schema_version":1,"status":"BLOCKED","stage":"preflight","reason":"passwordless_staging_auth_configuration_missing","workflow":"kds-pos-stock"}\n' > artifacts/kds-pos-stock-reconciliation.json
            exit 2
          fi
          if [ "$STAGING_SUPABASE_URL" != "https://higoadrzxnhzbbwhdbmh.supabase.co" ]; then
            echo "::error title=STAGING PREFLIGHT BLOCKED::Staging URL does not match the fixed staging project."
            mkdir -p artifacts
            printf '{"schema_version":1,"status":"BLOCKED","stage":"preflight","reason":"staging_target_mismatch","workflow":"kds-pos-stock"}\n' > artifacts/kds-pos-stock-reconciliation.json
            exit 2
          fi
          if ! node --input-type=module <<'NODE'
          import { isServiceRoleKey } from "./tests/runtime/supabase-api-key.mjs";
          if (!isServiceRoleKey(process.env.STAGING_SUPABASE_SERVICE_ROLE_KEY)) process.exit(1);
          NODE
          then
            mkdir -p artifacts
            printf '{"schema_version":1,"status":"BLOCKED","stage":"preflight","reason":"service_role_key_format_invalid","workflow":"kds-pos-stock"}\n' > artifacts/kds-pos-stock-reconciliation.json
            echo "::error title=STAGING PREFLIGHT BLOCKED::Service-role key format is invalid; no business-flow mutations ran."
            exit 2
          fi
      - name: Run POS, payment, KDS, recipe stock, receipt and offline replay E2E
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLIC_KEY: ${{ secrets.STAGING_SUPABASE_PUBLIC_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node tests/staging/kds-pos-stock-positive.mjs
      - name: Validate reconciliation artifact
        if: always()
        run: |
          mkdir -p artifacts
          file=artifacts/kds-pos-stock-reconciliation.json
          if [ ! -s "$file" ] || ! node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!x || typeof x !== "object" || typeof x.status !== "string") process.exit(1)' "$file" 2>/dev/null; then
            printf '{"schema_version":1,"status":"FAIL","stage":"artifact_validation","reason":"missing_or_invalid_reconciliation_artifact","workflow":"kds-pos-stock"}\n' > "$file"
            echo "::error title=Reconciliation artifact invalid::A missing or invalid POS reconciliation artifact was replaced with explicit FAIL evidence."
            exit 1
          fi
      - name: Upload sanitized POS reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pos-checkout-reconciliation-${{ github.run_id }}
          path: artifacts/kds-pos-stock-reconciliation.json
          if-no-files-found: warn
          retention-days: 30